<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark" />

    <!--
      Cascade layer order must be declared before ANY stylesheet: code-split CSS chunks can
      load before index.css, and the first layer mentioned wins its position otherwise.
      Also paints the brand background before CSS arrives (no white flash).
    -->
    <style>
      @layer properties, theme, base, components, utilities;
      html {
        background: #0a0a0a;
      }
    </style>

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- PLACEHOLDER images are served by picsum. Remove these once real images live in /public. -->
    <link rel="preconnect" href="https://picsum.photos" />
    <link rel="preconnect" href="https://fastly.picsum.photos" />

    <!--
      Static fallbacks for crawlers and link-preview bots that don't run JavaScript.
      They are removed on boot (src/main.tsx) and React 19 renders per-page tags instead.
      COPY: keep in sync with src/data/site.ts and src/data/pages.ts (home).
    -->
    <title data-static-meta>
      Stack Studio — Websites, apps, systems and AI that help businesses grow
    </title>
    <meta
      data-static-meta
      name="description"
      content="Stack Studio helps businesses stand out and grow with custom websites, apps, large systems and AI, plus hosting and ongoing care. Based in Centurion, South Africa."
    />
    <meta data-static-meta property="og:type" content="website" />
    <meta data-static-meta property="og:site_name" content="Stack Studio" />
    <meta
      data-static-meta
      property="og:title"
      content="Stack Studio — Websites, apps, systems and AI that help businesses grow"
    />
    <meta
      data-static-meta
      property="og:description"
      content="Stack Studio helps businesses stand out and grow with custom websites, apps, large systems and AI, plus hosting and ongoing care. Based in Centurion, South Africa."
    />
    <meta data-static-meta property="og:image" content="https://stackstudio.co.za/og-image.png" />
    <meta data-static-meta property="og:url" content="https://stackstudio.co.za/" />
    <meta data-static-meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Static shell: paints the brand instantly (fast FCP); React replaces it on first render. -->
    <div id="root">
      <div
        style="position: fixed; inset: 0; display: grid; place-items: center; background: #0a0a0a"
        aria-hidden="true"
      >
        <svg viewBox="0 0 100 100" width="56" height="56">
          <path d="M50 2 99 98H78L50 42 22 98H1Z" fill="#ff5a14" />
          <path d="M50 64 62 98H38Z" fill="#ff5a14" />
        </svg>
      </div>
    </div>
    <noscript>
      <div
        style="
          padding: 2rem;
          font-family: system-ui, sans-serif;
          background: #0a0a0a;
          color: #f4f0ea;
        "
      >
        Stack Studio needs JavaScript for this site. Email us at hello@stackstudio.co.za.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
