<div
  style="
    margin: 0;
    padding: 28px 12px;
    background: #f3f0eb;
    font-family: Arial, Helvetica, sans-serif;
    color: #151515;
  "
>
  <table
    role="presentation"
    width="100%"
    cellpadding="0"
    cellspacing="0"
    border="0"
    style="
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      border-collapse: collapse;
      background: #ffffff;
    "
  >
    <tr>
      <td style="padding: 22px 30px; background: #111111; border-bottom: 4px solid #ff5a14">
        <img
          src="{{logo_url}}"
          width="40"
          height="40"
          alt=""
          style="
            display: inline-block;
            width: 40px;
            height: 40px;
            vertical-align: middle;
            border: 0;
          "
        />
        <span
          style="
            padding-left: 12px;
            color: #f3f0eb;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            vertical-align: middle;
          "
          >STACK STUDIO</span
        >
      </td>
    </tr>
    <tr>
      <td style="padding: 32px 30px 20px">
        <p
          style="
            margin: 0 0 9px;
            color: #aa3e0c;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
          "
        >
          {{team_eyebrow}}
        </p>
        <h1 style="margin: 0 0 12px; color: #111111; font-size: 26px; line-height: 1.25">
          {{team_heading}}
        </h1>
        <p style="margin: 0; color: #525252; font-size: 14px; line-height: 1.6">
          From {{name}} &nbsp;&middot;&nbsp; {{time}}
        </p>
        {{#reference}}
        <p style="margin: 8px 0 0; color: #525252; font-size: 13px">
          Reference: <strong>{{reference}}</strong>
        </p>
        {{/reference}}
      </td>
    </tr>
    <tr>
      <td style="padding: 0 30px 28px">{{{content_html}}}</td>
    </tr>
    <tr>
      <td style="padding: 22px 30px; background: #f3f0eb; border-top: 1px solid #ded8d0">
        <a
          href="mailto:{{reply_to}}"
          style="
            display: inline-block;
            padding: 12px 18px;
            background: #111111;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
          "
          >Reply to {{name}}</a
        >
        <p style="margin: 13px 0 0; color: #666666; font-size: 12px; line-height: 1.5">
          Reply directly to this email to reach the sender.
        </p>
      </td>
    </tr>
  </table>
</div>
